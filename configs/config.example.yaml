# LLM 网关配置示例
# 复制为 config.yaml 并填入真实 key（或通过环境变量注入，推荐后者）。
# ${ENV_VAR} 形式的占位符会从环境变量展开。

server:
  addr: ":8080"

auth:
  # 调用方凭证列表：key 是请求 Authorization: Bearer <key> 中的值，
  # name 是该 key 的身份标识（token 计量按 name 归属，成本看板按 name 分组）
  client_keys:
    - name: dev
      key: "sk-gateway-dev-123456"   # 生产环境务必改成强随机值

# 双维度令牌桶限流（可选，缺省整段省略即不限流）
# rate_limit:
#   key_qps: 5        # 每个 client key 每秒请求数
#   key_burst: 10     # key 维度突发容量，缺省 = key_qps（至少 1）
#   model_qps: 20     # 每个 model 全局每秒请求数（所有 key 共享）
#   model_burst: 40   # model 维度突发容量，缺省 = model_qps

# Redis（可选）：token 计量聚合 + Week 3 缓存。
# 缺省整段省略 = 不使用 Redis（计量退化为进程内内存聚合，重启即丢）
redis:
  addr: "127.0.0.1:6380"   # compose 的 redis-stack 映射在宿主机 6380（6379 留给本机可能已存在的 redis）
  # password: ""
  # db: 0

# 响应缓存（可选，依赖 redis 段）
cache:
  exact_ttl: "1h"            # 精确缓存有效期（key = SHA256(model+messages)，仅非流式）；"0" = 禁用
  # semantic_ttl: "1h"       # 语义缓存有效期，缺省 = exact_ttl；依赖下方 embedding 段 + redis-stack
  # semantic_threshold: 0.95 # 语义命中所需余弦相似度（0~1），缺省 0.95；越高越保守

# embedding（可选，语义缓存依赖；整段省略 = 只精确缓存）
# 任何 OpenAI 兼容 embedding API 均可，示例为硅基流动免费的 bge-m3
embedding:
  base_url: "https://api.siliconflow.cn/v1"
  api_key: "${EMBEDDING_API_KEY}"
  model: "BAAI/bge-m3"
  dimensions: 1024          # bge-m3=1024；OpenAI text-embedding-3-small=1536

providers:
  # DeepSeek：OpenAI 兼容协议，便宜，适合开发联调
  - name: deepseek
    type: openai
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"
    models:
      - "deepseek-chat"
      - "deepseek-reasoner"
    # weight：负载均衡权重，缺省为 1。
    # 同一个 model 可配置在多个上游中，按 weight 平滑加权轮询分发，
    # 例如下面 deepseek 和 deepseek-backup 都服务 deepseek-chat，按 3:1 分流：
    #   - name: deepseek-backup
    #     base_url: "https://api.siliconflow.cn/v1"
    #     api_key: "${SILICONFLOW_API_KEY}"
    #     models: ["deepseek-chat"]
    #     weight: 1
    # 内置被动熔断（暂未开放配置）：同一上游连续失败 3 次熔断 30s，之后半开
    # 单探测试探恢复；首字节前失败（5xx/连接错误）自动 fallback 到其他候选。
    weight: 3

  # OpenAI：没有 key 可整段删除
  - name: openai
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    models:
      - "gpt-4o-mini"
      - "gpt-4o"
    weight: 1
