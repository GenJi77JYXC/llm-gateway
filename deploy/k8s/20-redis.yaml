# Redis Stack：token 计量聚合 + 精确缓存 + 语义向量检索（RediSearch 模块）
# 演示环境单副本 + emptyDir，不做持久化；重启 Pod 缓存与计量数据清空（可接受，主链路自动降级直连上游）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis/redis-stack:7.4.0-v0
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: llm-gateway
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
