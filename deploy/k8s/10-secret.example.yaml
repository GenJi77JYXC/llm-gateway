# 敏感凭证示例——真实值不入库。
# 用法：cp secret.example.yaml secret.yaml，填入真实 key 后随其他 manifests 一起 apply；
#       secret.yaml 已被 .gitignore 忽略。
# 也可以直接：kubectl create secret generic llm-gateway-secret -n llm-gateway \
#   --from-literal=DEEPSEEK_API_KEY=sk-xxx ...
apiVersion: v1
kind: Secret
metadata:
  name: llm-gateway-secret
  namespace: llm-gateway
type: Opaque
stringData:
  DEEPSEEK_API_KEY: "sk-改成你的真实key"
  OPENAI_API_KEY: "sk-改成你的真实key"
  EMBEDDING_API_KEY: "sk-改成你的真实key"
