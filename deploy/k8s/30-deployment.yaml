# 网关本体：多副本无状态（熔断器内存状态多实例共享见 T4.4）
# 镜像需本地构建后 kind load docker-image llm-gateway:local（见 README）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      containers:
        - name: gateway
          image: llm-gateway:local
          imagePullPolicy: IfNotPresent   # kind load 的本地镜像，不从远程拉取
          ports:
            - containerPort: 8080
          # 敏感凭证整 Secret 注入（key 名即环境变量名）
          envFrom:
            - secretRef:
                name: llm-gateway-secret
          env:
            - name: GIN_MODE
              value: "release"
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # 就绪探针：未通过不接流量（滚动更新/扩缩容时保护在途请求）
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          # 存活探针：进程卡死时由 kubelet 重启容器
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: llm-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  selector:
    app: llm-gateway
  ports:
    - port: 80
      targetPort: 8080
